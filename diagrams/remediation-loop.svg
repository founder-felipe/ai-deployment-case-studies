<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-labelledby="t d">
  <title id="t">Autonomous remediation loop — graduated autonomy by failure category</title>
  <desc id="d">A production error is fingerprinted and posted by a forwarder to a webhook service on a machine the operator controls. The service authenticates the call, takes a single-run lock with a staleness override, checks an hourly rate cap, appends a five-field ledger row, and spawns a headless coding agent under a policy document. The policy decides autonomy by category before the agent acts: workflow changes may be applied automatically with a timestamped backup, an abort guard, a dry run and a mandatory re-fetch to verify; application-code fixes are pull-request only and may never be merged or deployed; infrastructure actions are limited to an exhaustive allow-list; anything uncategorised is diagnostic-only with no mutations. The loop is denied authority over its own trigger path, and two independent kill switches — one on the agent machine, one on the production side — each stop it alone.</desc>
  <style>
    .bg{fill:#ffffff}
    .box{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5;rx:7}
    .svc{fill:#eef2ff;stroke:#4338ca;stroke-width:1.8;rx:8}
    .kill{fill:#fef2f2;stroke:#dc2626;stroke-width:1.8;rx:8}
    .l1{fill:#ecfdf5;stroke:#059669;stroke-width:1.8;rx:7}
    .l2{fill:#fff7ed;stroke:#ea580c;stroke-width:1.8;rx:7}
    .l3{fill:#fefce8;stroke:#ca8a04;stroke-width:1.8;rx:7}
    .l4{fill:#f8fafc;stroke:#64748b;stroke-width:1.8;rx:7}
    .t{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;fill:#0f172a;text-anchor:middle}
    .tb{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:#0f172a;text-anchor:middle}
    .s{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;fill:#475569;text-anchor:middle}
    .h{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:700;fill:#0f172a}
    .p{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11.5px;fill:#475569}
    .flow{stroke:#64748b;stroke-width:1.6;fill:none;marker-end:url(#a)}
    .killline{stroke:#dc2626;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="640"/>

  <rect class="box" x="30" y="30" width="200" height="56"/>
  <text class="t" x="130" y="54">production error</text>
  <text class="s" x="130" y="72">raised by the pipeline</text>

  <path class="flow" d="M230,58 L292,58"/>

  <rect class="box" x="292" y="30" width="200" height="56"/>
  <text class="t" x="392" y="54">forwarder</text>
  <text class="s" x="392" y="72">fingerprint + cooldown, fail-open</text>

  <path class="flow" d="M492,58 L554,58"/>

  <rect class="svc" x="554" y="30" width="316" height="56"/>
  <text class="tb" x="712" y="54">webhook service (operator machine)</text>
  <text class="s" x="712" y="72">auth · single-run lock · hourly rate cap · ledger append</text>

  <path class="flow" d="M712,86 L712,118 L450,118 L450,152"/>

  <rect class="svc" x="290" y="152" width="320" height="56" style="fill:#f5f3ff"/>
  <text class="tb" x="450" y="176">categorise BEFORE acting</text>
  <text class="s" x="450" y="194">the category decides autonomy — not model confidence</text>

  <path class="flow" d="M450,208 L450,232"/>
  <path class="flow" d="M120,232 L120,268"/><path class="flow" d="M330,232 L330,268"/>
  <path class="flow" d="M540,232 L540,268"/><path class="flow" d="M750,232 L750,268"/>
  <path d="M120,232 L750,232" stroke="#64748b" stroke-width="1.6" fill="none"/>

  <rect class="l1" x="30" y="268" width="180" height="126"/>
  <text class="tb" x="120" y="292">Workflow</text>
  <text class="t" x="120" y="314" style="font-size:12px;fill:#047857">full auto</text>
  <text class="s" x="120" y="338">timestamped backup first,</text>
  <text class="s" x="120" y="354">abort guard, dry-run print,</text>
  <text class="s" x="120" y="370">mandatory re-fetch to verify.</text>
  <text class="s" x="120" y="386">Reversible by restore.</text>

  <rect class="l2" x="240" y="268" width="180" height="126"/>
  <text class="tb" x="330" y="292">Application code</text>
  <text class="t" x="330" y="314" style="font-size:12px;fill:#c2410c">pull request only</text>
  <text class="s" x="330" y="338">failing test first, then fix,</text>
  <text class="s" x="330" y="354">then suite, then PR.</text>
  <text class="s" x="330" y="370">May not merge. May not</text>
  <text class="s" x="330" y="386">deploy. May not touch prod.</text>

  <rect class="l3" x="450" y="268" width="180" height="126"/>
  <text class="tb" x="540" y="292">Infrastructure</text>
  <text class="t" x="540" y="314" style="font-size:12px;fill:#a16207">exhaustive allow-list</text>
  <text class="s" x="540" y="338">read-only diagnostics, restart</text>
  <text class="s" x="540" y="354">a named service, re-activate,</text>
  <text class="s" x="540" y="370">retry. Everything else is</text>
  <text class="s" x="540" y="386">forbidden by enumeration.</text>

  <rect class="l4" x="660" y="268" width="180" height="126"/>
  <text class="tb" x="750" y="292">Unknown</text>
  <text class="t" x="750" y="314" style="font-size:12px;fill:#475569">diagnostic only</text>
  <text class="s" x="750" y="338">no mutations at all.</text>
  <text class="s" x="750" y="354">Produce a precise report</text>
  <text class="s" x="750" y="370">with next steps.</text>
  <text class="s" x="750" y="386">Completes by declining.</text>

  <path class="flow" d="M330,394 L330,428"/>
  <rect class="box" x="230" y="428" width="200" height="52"/>
  <text class="t" x="330" y="450">human review + deploy</text>
  <text class="s" x="330" y="468">approval is an action, not a silence</text>

  <!-- guards -->
  <rect class="kill" x="30" y="504" width="400" height="106"/>
  <text class="h" x="50" y="530" style="fill:#991b1b">Guards that sit around all four lanes</text>
  <text class="p" x="50" y="552" style="fill:#7f1d1d">The loop may not modify its own trigger path — a failure in</text>
  <text class="p" x="50" y="570" style="fill:#7f1d1d">the forwarder, this service or the error endpoint is forced to</text>
  <text class="p" x="50" y="588" style="fill:#7f1d1d">the diagnostic-only lane. An agent that can fix its own</text>
  <text class="p" x="50" y="604" style="fill:#7f1d1d">supervisor has no supervisor.</text>

  <rect class="kill" x="470" y="504" width="400" height="106"/>
  <text class="h" x="490" y="530" style="fill:#991b1b">Two independent kill switches</text>
  <text class="p" x="490" y="552" style="fill:#7f1d1d">One on the machine running the agent; one on the production</text>
  <text class="p" x="490" y="570" style="fill:#7f1d1d">side that stops errors being forwarded at all.</text>
  <text class="p" x="490" y="592" style="fill:#7f1d1d;font-weight:700">Either one alone stops the loop.</text>

  <path class="killline" d="M870,86 L884,86 L884,520 L870,520"/>
  <path class="killline" d="M30,58 L14,58 L14,548 L30,548"/>
</svg>
